# Metadados declarativos apenas — este pacote não é instalado via pip.
# Consumidores importam por sys.path (workspace-raiz na sys.path), não por
# `pip install`; por isso não há [build-system]/backend declarado: adicionar
# um sem nunca ter testado `pip install .` seria afirmar suporte não
# verificado. Se isso mudar, adicionar [build-system] e validar a instalação
# antes de declará-la.
[project]
name = "tools"
version = "1.3.6"
description = "Camada operacional canônica do ecossistema preditivo: runners, locks, provenance, redaction, manifests. Stdlib-only por design — nenhuma dependência externa."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# A raiz do workspace precisa estar na sys.path para `import tools.x` — e o
# consumo desta camada e por sys.path, nao por `pip install`. Declarar aqui
# torna a suite reproduzivel com `python -m pytest` puro; antes ela exigia
# PYTHONPATH=<workspace> passado a mao, e sem ele 4 modulos nem coletavam.
pythonpath = [".."]
