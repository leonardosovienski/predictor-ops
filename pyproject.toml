[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "predictor-ops"
version = "2.0.1"
description = "Portable operational runner for predictor workloads"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
redis = ["redis>=6,<8"]
otel = [
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
]
dev = [
  "build>=1.3",
  "coverage[toml]>=7.10",
  "fakeredis>=2.31",
  "hatchling>=1.27",
  "pre-commit>=4.3",
  "pyright>=1.1.403",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "pytest-timeout>=2.4",
  "ruff>=0.12",
]

[project.scripts]
predictor-ops = "predictor_ops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/predictor_ops"]

[tool.pytest.ini_options]
testpaths = ["tests_v2"]
addopts = "-ra --strict-markers"
timeout = 30

[tool.coverage.run]
source = ["predictor_ops"]
branch = true
omit = ["*/predictor_ops/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests_v2"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingImports = false
