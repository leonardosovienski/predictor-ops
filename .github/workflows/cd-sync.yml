name: Release validation - Tools Predictor

on:
  release:
    types: [published]

jobs:
  verify-release:
    name: Verify release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `release_check.py` expects tools to be a child of its workspace.
          path: tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Run isolated release preflight
        run: python tools/release_check.py
