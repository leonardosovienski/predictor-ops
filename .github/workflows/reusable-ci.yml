name: CI - Tools Predictor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          # Reproduces the supported workspace import topology.
          path: tools
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest pytest-cov
      - name: Run tests with coverage gate
        run: python -m pytest tools/tests -q --cov=tools --cov-fail-under=80
