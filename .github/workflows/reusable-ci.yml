name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.11'
      run-dotnet:
        required: false
        type: boolean
        default: false

  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.11' }}
          cache: 'pip'

      - name: Setup .NET
        if: ${{ inputs.run-dotnet == true }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest 
          
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Simular Workspace Local (sys.path)
        run: |
          # Se houver pyproject.toml, lemos o 'name' oficial do pacote e criamos um 
          # atalho na pasta raiz. Isso faz o 'pythonpath = [".."]' funcionar igualzinho na sua máquina!
          if [ -f pyproject.toml ]; then
            PACKAGE_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb')).get('project', {}).get('name', ''))")
            if [ -n "$PACKAGE_NAME" ]; then
              echo "Mapeando a pasta atual para ../$PACKAGE_NAME"
              ln -sfn $(pwd) ../$PACKAGE_NAME
            fi
          fi

      - name: Executar Testes
        run: |
          python -m pytest -v
